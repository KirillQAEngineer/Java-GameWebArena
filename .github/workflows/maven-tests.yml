# Название проверки в GitHub Actions.
name: Maven Tests

# События, запускающие автоматические проверки.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - test
      - master

# Разрешаем только чтение репозитория.
permissions:
  contents: read

jobs:
  # API, unit и integration тесты.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run API and unit tests
        run: mvn -B clean test -Dtest=CharacterApiTest,CharacterApiNegativeTest,CharacterApiIntegrationTest,CharacterControllerTest,CharacterServiceTest
        working-directory: api

  # Запускаем Chrome и Firefox в отдельных matrix-запусках.
  web-ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - ChromeCharacterUiTest
          - FirefoxCharacterUiTest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Install Firefox
        if: matrix.browser == 'FirefoxCharacterUiTest'
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Start Spring Boot application
        run: |
          nohup mvn -B spring-boot:run > app.log 2>&1 &
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        working-directory: api

      - name: Run browser UI tests
        run: mvn -B -Dtest=${{ matrix.browser }} test
        working-directory: api
        env:
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}

      - name: Show application log if tests fail
        if: failure()
        run: cat app.log
        working-directory: api

  # Safari запускается на macOS.
  safari-ui-tests:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - name: Start Spring Boot application
        run: |
          nohup mvn -B spring-boot:run > app.log 2>&1 &
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        working-directory: api

      - name: Run Safari UI tests
        run: mvn -B -Dtest=SafariCharacterUiTest test
        working-directory: api

      - name: Show application log if tests fail
        if: failure()
        run: cat app.log
        working-directory: api

  # Запускаем Android Chrome и Firefox в отдельных matrix-прогонах.
  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Каждый браузер получает отдельную задачу и собственный эмулятор.
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox

    steps:
      # Получаем исходный код репозитория.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем Java 23 и настраиваем Maven cache.
      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Устанавливаем Node.js для запуска Appium 3.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Устанавливаем Appium Server версии 3.
      - name: Install Appium 3
        run: npm install --global appium@3

      # Устанавливаем драйвер управления Android через UiAutomator2.
      - name: Install UiAutomator2 driver
        run: appium driver install uiautomator2

      # Устанавливаем Gecko только для Firefox-прогона.
      - name: Install Gecko driver
        if: matrix.browser == 'firefox'
        run: appium driver install gecko

      # Устанавливаем бинарный GeckoDriver только для Firefox.
      - name: Install GeckoDriver binary
        if: matrix.browser == 'firefox'
        run: |
          curl --fail --location --retry 3 --output /tmp/geckodriver.tar.gz "https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz"
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          sudo install -m 0755 /tmp/geckodriver /usr/local/bin/geckodriver
          geckodriver --version

      # Запускаем Spring Boot в фоновом режиме.
      - name: Start Spring Boot application
        run: |
          nohup mvn -B spring-boot:run > app.log 2>&1 &
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        working-directory: api

      # Включаем KVM для аппаратной виртуализации Android Emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Каждый matrix-прогон запускает собственный Android Emulator.
      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-ui-tests.sh ${{ matrix.browser }}

      # Загружаем диагностические файлы при ошибке.
      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.browser }}-diagnostics
          path: |
            appium.log
            android-logcat.log
            api/app.log
            api/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
