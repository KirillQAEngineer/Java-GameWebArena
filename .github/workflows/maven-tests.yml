# Название проверки в GitHub Actions.
name: Maven Tests

# События, запускающие автоматические проверки.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - test
      - master

# Разрешаем только чтение репозитория.
permissions:
  contents: read

jobs:
  # API, unit и integration тесты.
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Run API and unit tests
        run: mvn -B clean test -Dtest=CharacterApiTest,CharacterApiNegativeTest,CharacterApiIntegrationTest,CharacterControllerTest,CharacterServiceTest
        working-directory: api

  # Запускаем Chrome и Firefox в отдельных matrix-запусках.
  web-ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - ChromeCharacterUiTest
          - FirefoxCharacterUiTest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Install Firefox
        if: matrix.browser == 'FirefoxCharacterUiTest'
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Start Spring Boot application
        run: |
          nohup mvn -B spring-boot:run > app.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        working-directory: api

      - name: Run browser UI tests
        run: mvn -B -Dtest=${{ matrix.browser }} test
        working-directory: api

      - name: Show application log if tests fail
        if: failure()
        run: cat app.log
        working-directory: api

  # Safari запускается на macOS.
  safari-ui-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - name: Start Spring Boot application
        run: |
          nohup mvn -B spring-boot:run > app.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
        working-directory: api

      - name: Run Safari UI tests
        run: mvn -B -Dtest=SafariCharacterUiTest test
        working-directory: api

      - name: Show application log if tests fail
        if: failure()
        run: cat app.log
        working-directory: api
